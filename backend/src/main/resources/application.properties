spring.application.name=supplier-registration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:supplier
spring.datasource.username=sa
spring.datasource.password=

# ADR-0011: mensajes de validación siempre en inglés, sin importar la JVM ni Accept-Language
spring.web.locale=en
spring.web.locale-resolver=fixed