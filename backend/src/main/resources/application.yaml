spring:
  application:
    name: supplier-registration
  # ADR-0017/ADR-0018: PostgreSQL 17; en las pruebas la conexión la aporta Testcontainers
  datasource:
    url: ${REGISTRATION_DB_URL:}
    username: ${REGISTRATION_DB_USERNAME:}
    password: ${REGISTRATION_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea y evoluciona el esquema; Hibernate solo lo valida
      ddl-auto: validate
  web:
    # ADR-0011: mensajes de validación siempre en inglés, sin importar la JVM ni Accept-Language
    locale: en
    locale-resolver: fixed
  jackson:
    deserialization:
      # ADR-0009: los requests rechazan propiedades no definidas con VALIDATION_ERROR
      fail-on-unknown-properties: true

# ADR-0015: emisor y audiencia del JWT de registro; las llaves RSA (PEM) se ubican por variables de entorno
registration:
  jwt:
    issuer: supplier-registration
    audience: supplier-registration-api
    public-key-location: ${REGISTRATION_JWT_PUBLIC_KEY_LOCATION:}
    private-key-location: ${REGISTRATION_JWT_PRIVATE_KEY_LOCATION:}
