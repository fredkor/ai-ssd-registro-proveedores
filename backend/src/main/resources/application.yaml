spring:
  application:
    name: supplier-registration
  # ADR-0017/ADR-0018: PostgreSQL 17; en las pruebas la conexión la aporta Testcontainers
  datasource:
    url: ${REGISTRATION_DB_URL:}
    username: ${REGISTRATION_DB_USERNAME:}
    password: ${REGISTRATION_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea y evoluciona el esquema; Hibernate solo lo valida
      ddl-auto: validate
  web:
    # ADR-0004/ADR-0019: mensajes de validación siempre en inglés, sin importar la JVM ni Accept-Language
    locale: en
    locale-resolver: fixed
  servlet:
    multipart:
      # ADR-0010/US10: 5 MiB per file (the exact maximum is allowed); the request also carries headers and boundaries.
      max-file-size: 5242880B
      max-request-size: 6MB
  jackson:
    deserialization:
      # ADR-0009: los requests rechazan propiedades no definidas con VALIDATION_ERROR
      fail-on-unknown-properties: true

# ADR-0019: /error es la ruta interna de ProblemErrorController, no una operación del contrato
springdoc:
  paths-to-exclude: /error
  # ADR-0008: Swagger UI muestra el contrato autoritativo (con su esquema Bearer), no el deducido del código
  swagger-ui:
    url: /supplier-registration-openapi.yaml

# ADR-0015: emisor y audiencia del JWT de registro; las llaves RSA (PEM) se ubican por variables de entorno
registration:
  jwt:
    issuer: supplier-registration
    audience: supplier-registration-api
    public-key-location: ${REGISTRATION_JWT_PUBLIC_KEY_LOCATION:}
    private-key-location: ${REGISTRATION_JWT_PRIVATE_KEY_LOCATION:}
  # ADR-0010: raíz del volumen documental; la ruta relativa de cada archivo se guarda en metadatos
  documents:
    root-location: ${REGISTRATION_DOCUMENTS_ROOT:/repository}
