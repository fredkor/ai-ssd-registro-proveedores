openapi: 3.0.3
info:
  title: Registro de proveedores de Fredkor Labs API
  version: 0.1.0
  description: 'Primera etapa: aviso, Firma Electrónica, token de registro, expediente, Datos
    Generales, cédula fiscal y CUCoP. IDs de catálogos enteros y resultado del componente conforme a ResultadoFirma.
    Habilitado para generación e implementación.'
x-contract-status: READY
x-implementation-ready: true
x-pending-decisions: []
servers:
- url: /
  description: Mismo origen del servicio; configuración de despliegue por definir.
tags:
- name: RegistrationNotices
- name: ApplicantIdentifications
- name: SupplierRegistrations
- name: FiscalDocuments
- name: RegistrationCatalogs
paths:
  /api/v1/registration-notices/current:
    get:
      tags:
      - RegistrationNotices
      summary: Consultar Política de Aviso vigente
      operationId: getRegistrationNotice
      description: Presentar antes de ejecutar la firma inicial. Versión 1.0.
      x-spec-refs:
      - RF-REG-03
      - US03
      x-use-case: GetRegistrationNoticeUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationNoticeResponse'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/registration-notice-acceptances:
    post:
      tags:
      - RegistrationNotices
      summary: Registrar aceptación expresa del aviso
      operationId: acceptRegistrationNotice
      description: La aceptación no crea expediente. Hora del backend. Si falla, no habilita firma.
      x-spec-refs:
      - RF-REG-03
      - US03
      x-use-case: AcceptRegistrationNoticeUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeAcceptanceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRegistrationNoticeRequest'
      security: []
  /api/v1/applicant-identifications:
    post:
      tags:
      - ApplicantIdentifications
      summary: Procesar Firma Electrónica del solicitante
      operationId: identifyApplicant
      description: Requiere aceptación del aviso anterior a firmar. Verifica sello contra contenido y certificado
        y conserva íntegro el resultado aceptado. El componente externo, no este endpoint, comprueba vigencia
        y OCSP. Sin credenciales privadas. Usa noticeAcceptanceId para comprobar aceptación previa. Si es inexistente,
        con formato inválido o ya usada en una identificación exitosa produce VALIDATION_ERROR. Un resultado=false
        no habilita identificación. Solo después de verificar y conservar el resultado emite registrationToken.
        El token vence a los 60 minutos y no invalida otros tokens vigentes del mismo RFC. El sello es
        RSA PKCS#1 v1.5 con SHA-256 sobre los bytes UTF-8 de cadenaOriginal; el backend verifica con SHA256withRSA
        según ADR-0016.
      x-spec-refs:
      - RF-REG-01
      - RF-REG-03
      - US01
      - US03
      x-use-case: IdentifyApplicantUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantIdentificationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/SignatureVerificationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyApplicantRequest'
      security: []
  /api/v1/supplier-registrations/existence:
    get:
      tags:
      - SupplierRegistrations
      summary: Consultar existencia para la identidad aceptada
      operationId: checkRegistrationExistence
      description: No recibe RFC como filtro libre. La ausencia normal retorna exists=false; un error no se
        convierte en inexistencia.
      x-spec-refs:
      - RF-REG-02
      - US02
      x-use-case: CheckRegistrationExistenceUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationExistenceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      security:
      - RegistrationToken: []
  /api/v1/supplier-registrations:
    post:
      tags:
      - SupplierRegistrations
      summary: Crear expediente de registro
      operationId: startSupplierRegistration
      description: Crea UUID en IN_PROGRESS solo tras aceptación, identificación exitosa e inexistencia comprobada.
        Impide duplicidad concurrente. Abre Datos Generales. La identidad y aceptación se resuelven exclusivamente
        desde el token; no requiere cuerpo de petición.
      x-spec-refs:
      - RF-REG-04
      - US04
      x-use-case: StartSupplierRegistrationUseCase
      x-implementation-ready: true
      responses:
        '201':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRegistrationResponse'
          headers:
            Location:
              description: URL del expediente creado.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '409':
          $ref: '#/components/responses/DuplicateRfc'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      x-transition: '- -> IN_PROGRESS'
      security:
      - RegistrationToken: []
  /api/v1/supplier-registrations/{registrationId}/resume:
    parameters:
    - $ref: '#/components/parameters/RegistrationId'
    post:
      tags:
      - SupplierRegistrations
      summary: Reanudar expediente incompleto
      operationId: resumeSupplierRegistration
      description: Exige nueva identificación del mismo RFC. Recupera el mismo expediente y siempre abre Datos
        Generales; no sobrescribe datos ante un fallo. REGISTERED no puede reanudarse como borrador. La identidad
        y aceptación se resuelven exclusivamente desde el token; no requiere cuerpo de petición. Al reanudar se actualiza legalName desde el nuevo certificado verificado del mismo RFC y se vincula históricamente su evidencia sin sobrescribir las anteriores; ambas acciones se confirman en una transacción. Se conservan UUID, datos capturados, documentos confirmados y progreso, incluido CUCoP. Un fallo revierte la actualización del nombre y vínculo histórico sin eliminar la evidencia conservada al identificar.
      x-spec-refs:
      - RF-REG-06
      - US05
      x-use-case: ResumeSupplierRegistrationUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      security:
      - RegistrationToken: []
  /api/v1/supplier-registrations/{registrationId}/general-data:
    parameters:
    - $ref: '#/components/parameters/RegistrationId'
    put:
      tags:
      - SupplierRegistrations
      summary: Validar y guardar Datos Generales completos
      operationId: saveGeneralData
      description: Invocado por Siguiente. Valida datos, teléfonos y cédula previamente asociada, y guarda
        datos y progreso en una transacción. No cambia estado global ni permite editar identidad. Atrás no
        invoca esta operación.
      x-spec-refs:
      - RF-REG-05
      - US06
      - US08
      - US09
      - US10
      x-use-case: SaveGeneralDataUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSaveResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralDataRequest'
      security:
      - RegistrationToken: []
  /api/v1/supplier-registrations/{registrationId}/cucop:
    parameters:
    - $ref: '#/components/parameters/RegistrationId'
    put:
      tags:
      - SupplierRegistrations
      summary: Validar y guardar participación CUCoP
      operationId: saveCucopParticipation
      description: Requiere Datos Generales guardados, uno o ambos tipos y al menos una específica. Resuelve
        catálogo y guarda sección y progreso atómicamente. Continúa hacia Contactos. Atrás, selección y Deshacer
        no guardan.
      x-spec-refs:
      - RF-REG-08
      - RF-REG-05
      - US11
      - US06
      x-use-case: SaveCucopParticipationUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSaveResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CucopParticipationRequest'
      security:
      - RegistrationToken: []
  /api/v1/supplier-registrations/{registrationId}/fiscal-document:
    parameters:
    - $ref: '#/components/parameters/RegistrationId'
    post:
      tags:
      - FiscalDocuments
      summary: Cargar la única cédula fiscal
      operationId: uploadFiscalDocument
      description: Guarda y asocia inmediatamente el PDF de máximo 5 MiB (5,242,880 bytes) al expediente y devuelve UUID y metadatos; disponible al regresar o reanudar sin Siguiente. No completa Datos Generales. No informa éxito parcial; seguir ADR-0010.
      x-spec-refs:
      - RF-REG-05
      - US10
      x-use-case: UploadFiscalDocumentUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalDocumentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RegistrationNotFound'
        '409':
          $ref: '#/components/responses/DocumentConflict'
        '413':
          $ref: '#/components/responses/DocumentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedDocument'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Un único PDF, máximo 5 MiB (5,242,880 bytes) inclusive sobre el archivo. Extensión .pdf sin distinguir mayúsculas/minúsculas y contenido PDF comprobado en servidor; no basta el nombre ni el MIME declarado. No se interpreta maxLength como bytes.
                  x-max-size-bytes: 5242880
              required:
              - file
              additionalProperties: false
            encoding:
              file:
                contentType: application/pdf
      security:
      - RegistrationToken: []
    get:
      tags:
      - FiscalDocuments
      summary: Descargar cédula fiscal asociada
      operationId: downloadFiscalDocument
      description: Solo para el expediente correspondiente a la identificación aceptada. Presenta nombre original
        sin exponer ruta física.
      x-spec-refs:
      - RF-REG-05
      - US10
      x-use-case: DownloadFiscalDocumentUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Contenido del PDF asociado.
          headers:
            Content-Disposition:
              description: Descarga usando nombre original conforme al formato del encabezado; sin ruta del
                volumen.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      security:
      - RegistrationToken: []
    delete:
      tags:
      - FiscalDocuments
      summary: Eliminar cédula fiscal asociada
      operationId: deleteFiscalDocument
      description: Requiere advertencia y confirmación. En una transacción de BD retira la referencia del expediente, marca associated=false en metadatos y deja Datos Generales PENDING sin afectar CUCoP. No borra ni mueve contenido físico y no espera Siguiente. Fallo hace rollback de referencia, marca y progreso; éxito solo después del commit. Los metadatos se conservan y el proceso diario borra físicamente los no asociados elegibles. El documento desasociado no se muestra ni descarga desde el expediente.
      x-spec-refs:
      - RF-REG-05
      - US10
      x-use-case: DeleteFiscalDocumentUseCase
      x-implementation-ready: true
      responses:
        '204':
          description: Desasociación, marca de metadatos y progreso confirmados en BD; el borrado físico queda al proceso diario.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - RegistrationToken: []
  /api/v1/registration-catalogs/general-data:
    get:
      tags:
      - RegistrationCatalogs
      summary: Cargar catálogos completos y dependientes de Datos Generales
      operationId: getGeneralDataCatalogs
      description: Catálogos completos de Datos Generales, excepto subsectors filtrado por sectorId cuando
        se informa. Estratificación se devuelve completa, sin asociación ni filtro por régimen. Sin paginación. Si
        sectorId no se informa, subsectors se omite; si se informa y no hay opciones, retorna lista vacía.
        Las demás colecciones se devuelven completas. Los catálogos con campo activo (hoy Estratificación) solo devuelven registros activos; un ID inactivo se rechaza al guardar. Titularidad jurídica se filtra en frontend por país y régimen para Nacional, y por país o key NOT_DEF para Extranjero sin filtro por régimen; orden ascendente por key.
      x-spec-refs:
      - RF-REG-05
      - US08
      x-use-case: GetGeneralDataCatalogsUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralDataCatalogsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      parameters:
      - name: sectorId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CatalogId'
        description: Cuando se informa, devolver los subsectores del sector seleccionado. Sin este parámetro
          no se consulta ni incluye subsectors.
      security:
      - RegistrationToken: []
  /api/v1/registration-catalogs/cucop:
    get:
      tags:
      - RegistrationCatalogs
      summary: Cargar el árbol CUCoP completo
      operationId: getCucopCatalog
      description: Devuelve todos los capítulos, conceptos, partidas genéricas y específicas, incluidos sus
        IDs de padre, en una sola consulta sin paginación. El frontend reconstruye el árbol y busca por clave
        o palabra desde el tercer carácter, sin peticiones por expansión ni búsqueda. El volumen aproximado
        de 300 elementos no es un límite contractual. La tabla visual de seleccionadas pagina 10 filas.
      x-spec-refs:
      - RF-REG-08
      - US11
      x-use-case: GetCucopCatalogUseCase
      x-implementation-ready: true
      responses:
        '200':
          description: Operación completada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CucopCatalogResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/InvalidRegistrationToken'
      x-requires-accepted-identification: true
      security:
      - RegistrationToken: []
components:
  parameters:
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RegistrationId'
  schemas:
    Rfc:
      type: string
      minLength: 12
      maxLength: 13
      description: RFC recibido de una Firma Electrónica aceptada. No se normaliza por este contrato.
    RegistrationId:
      type: string
      format: uuid
    CatalogId:
      type: integer
      description: Identificador entero de catálogo. No se impone tamaño físico ni rango adicional.
    RegistrationStatus:
      type: string
      enum:
      - IN_PROGRESS
      - REGISTERED
    SectionStatus:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - REQUIRES_REVIEW
    RegistrationSection:
      type: string
      enum:
      - GENERAL_DATA
      - CUCOP
      - CONTACTS
      - FISCAL_ADDRESS
      - COVERAGE
      - ELECTRONIC_SIGNATURE
    TaxRegime:
      type: string
      enum:
      - LEGAL_ENTITY
      - INDIVIDUAL
    Origin:
      type: string
      enum:
      - NATIONAL
      - FOREIGN
    ParticipationType:
      type: string
      enum:
      - GOODS_AND_SERVICES_SUPPLIER
      - PUBLIC_WORKS_CONTRACTOR
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - REGISTRATION_TOKEN_INVALID
      - REGISTRATION_ACCESS_DENIED
      - REGISTRATION_NOT_FOUND
      - FISCAL_DOCUMENT_NOT_FOUND
      - DUPLICATE_RFC
      - INVALID_STATE_TRANSITION
      - FISCAL_DOCUMENT_ALREADY_EXISTS
      - DOCUMENT_TOO_LARGE
      - DOCUMENT_FORMAT_NOT_SUPPORTED
      - SIGNATURE_VERIFICATION_FAILED
      - REGISTRATION_INCOMPLETE
      - INTERNAL_ERROR
    ProblemResponse:
      type: object
      description: Error en formato Problem Details (RFC 9457) conforme a ADR-0019. Media type application/problem+json.
        No contiene trazas, rutas físicas ni evidencia completa.
      properties:
        type:
          type: string
          description: URN del tipo de problema, urn:fredkorlabs:registration:problem:<código en kebab-case>.
          example: urn:fredkorlabs:registration:problem:validation-error
        title:
          type: string
          description: Resumen fijo del tipo de problema, en inglés.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP de la respuesta.
        detail:
          type: string
          description: Explicación de esta ocurrencia, en inglés, sin datos internos.
        instance:
          type: string
          description: Ruta de la petición que originó el problema.
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Errores por campo de la petición; vacío cuando el problema no se atribuye a un campo.
          items:
            $ref: '#/components/schemas/ProblemFieldErrorResponse'
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - errors
      additionalProperties: false
    ProblemFieldErrorResponse:
      type: object
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) al lugar del cuerpo de la petición que falló.
          example: /signatureResult/cadenaOriginal
        detail:
          type: string
          description: Descripción breve en inglés; no repite el valor recibido.
          example: must be one of [Temporal]
      required:
      - pointer
      - detail
      additionalProperties: false
    RegistrationNoticeResponse:
      type: object
      properties:
        version:
          type: string
          enum:
          - '1.0'
        text:
          type: string
          example: 'Al registrarse en el Sistema de Compras de "Fredkor Labs" MANIFIESTA SU CONFORMIDAD Y ACEPTACIÓN
            para:


            Que los actos pertinentes al sistema, desde su inicio hasta su conclusión, se realicen a través
            de medios de comunicación electrónica usando su correo electrónico;


            Que se dé por notificado de las actuaciones electrónicas que emita la empresa, en el mismo día
            en que consulta el Sistema de Compras de Fredkor Labs, y


            Que en el supuesto de que por causas imputables a la empresa se encuentre imposibilitado para consultar
            el sistema, o abrir los documentos electrónicos que contengan la información depositada en dicho
            sistema, en los días quince y último de cada mes o bien, el día hábil siguiente si alguno de éstos
            fuera inhábil, lo hará del conocimiento de la empresa a más tardar dentro de los tres días hábiles
            siguientes a aquél en que ocurra dicho impedimento, por medios de comunicación electrónica.'
      required:
      - version
      - text
      additionalProperties: false
    AcceptRegistrationNoticeRequest:
      type: object
      properties:
        version:
          type: string
          enum:
          - '1.0'
      required:
      - version
      additionalProperties: false
      description: Invocar solo tras la aceptación expresa. Cancelar no llama a este endpoint.
    NoticeAcceptanceResponse:
      type: object
      properties:
        version:
          type: string
          enum:
          - '1.0'
        acceptedAt:
          type: string
          format: date-time
        acceptanceId:
          type: string
          minLength: 1
          description: Referencia opaca a la aceptación conservada por el backend. Se envía al procesar la
            Firma Electrónica; no autoriza acceso al expediente.
      required:
      - version
      - acceptedAt
      - acceptanceId
      additionalProperties: false
      description: Versión y hora del backend, con referencia para correlacionar la aceptación antes de firmar.
    SignatureResultRequest:
      type: object
      additionalProperties: false
      description: Objeto completo ResultadoFirma del componente, sin renombrar propiedades. Aunque el tipo
        TypeScript declara propiedades opcionales, en el request todas deben estar presentes y no nulas, salvo
        curp, que es opcional y se envía como null cuando no tiene valor. El backend exige los datos necesarios para verificar el sello. Rechaza propiedades no definidas. No incluye llave privada ni contraseña.
      properties:
        resultado:
          type: boolean
          enum:
          - true
          description: Solo resultado=true permite procesar una identificación exitosa. Un resultado=false
            se rechaza sin token.
        fechaVigencia:
          type: string
          format: date-time
          description: Date de TypeScript representado en JSON como cadena ISO 8601 con zona horaria.
        mensaje:
          type: string
        cadenaOriginal:
          type: string
          enum:
          - Temporal
          description: Texto original firmado, codificado como UTF-8 antes de calcular SHA-256. En el registro
            inicial es exactamente Temporal.
        certificado:
          type: string
          description: Certificado entregado por el componente, codificado en Base64. Es el que se usa para
            verificar el sello y extraer la identidad.
          format: byte
          minLength: 1
        cadenaFirma:
          type: string
          minLength: 1
          description: Firma RSA PKCS#1 v1.5 con SHA-256 sobre los bytes UTF-8 de cadenaOriginal, codificada
            en Base64. Verificación Java con SHA256withRSA.
          format: byte
        rfc:
          $ref: '#/components/schemas/Rfc'
        curp:
          type: string
          nullable: true
        razonSocial:
          type: string
          minLength: 1
        numeroSerie:
          type: number
          description: Tipo number según ResultadoFirma; no se cambia a string ni se trunca. La conservación
            del resultado no reconstruye precisión perdida antes de recibirse.
        tipoCertificado:
          type: number
          description: Código recibido del componente; no se inventan sus valores.
        certificadoPem:
          type: string
          description: Certificado en representación PEM entregado por el componente. Se conserva como evidencia.
          minLength: 1
        isVigente:
          type: boolean
          description: Dato del componente, responsable de vigencia y OCSP.
        origen:
          type: string
          description: Valor original del componente. No sustituye el Origen Nacional/Extranjero que el proveedor
            selecciona en Datos Generales.
      required:
      - resultado
      - fechaVigencia
      - mensaje
      - cadenaOriginal
      - certificado
      - cadenaFirma
      - rfc
      - curp
      - razonSocial
      - numeroSerie
      - tipoCertificado
      - certificadoPem
      - isVigente
      - origen
      x-domain-rules:
      - 'certificado y certificadoPem son obligatorios. La verificación del sello y la extracción de identidad
        usan certificado (Base64); certificadoPem se conserva como evidencia. Solo curp admite null. Se conserva
        el resultado completo sin descartar ninguno de sus campos.'
      - 'El RFC del titular se obtiene del atributo de sujeto 2.5.4.45 del mismo certificado utilizado para verificar el sello: dividir por / y tomar el segmento de índice 0. Debe tener 12 o 13 caracteres y coincidir exactamente con rfc, sin recorte ni conversión de mayúsculas/minúsculas. Los segmentos posteriores, incluido el RFC del apoderado, no son alternativas válidas.'
      - 'Atributo ausente, primer segmento vacío o longitud inválida: VALIDATION_ERROR. RFC recibido distinto del extraído: SIGNATURE_VERIFICATION_FAILED. Ninguno emite token ni permite continuar o crear expediente.'
      - 'legalName se extrae del primer atributo del sujeto del mismo certificado verificado cuyo OID sea 2.5.4.3, 2.5.4.41 o 2.5.4.10, respetando el orden original de los atributos, sin prioridad por OID, concatenación ni normalización. Aplica a persona física y moral. razonSocial recibido se conserva intacto como evidencia; si difiere, se utiliza el nombre del certificado para la identidad. Sin atributo coincidente o con su primer valor vacío se responde VALIDATION_ERROR, sin token ni continuación.'
      - Solo resultado=true y datos obligatorios válidos permiten verificar el sello y emitir token.
      - node-forge firma el digest SHA-256 de cadenaOriginal en UTF-8 con una clave privada RSA y el esquema
        predeterminado PKCS#1 v1.5. El backend decodifica cadenaFirma y verifica con SHA256withRSA sobre los
        bytes originales, sin aplicar un hash manual adicional.
