          description: ID entero de catálogo; obligatorio y no nulo para persona moral, no solicitado para
            persona física y debe enviarse null.
        businessActivityId:
          $ref: '#/components/schemas/CatalogId'
        stratificationId:
          description: Selección obligatoria de exactamente una opción del catálogo de estratificación, sin asociación ni filtro por régimen.
          allOf:
          - $ref: '#/components/schemas/CatalogId'
        primaryActivityId:
          $ref: '#/components/schemas/CatalogId'
        workerCountRangeId:
          $ref: '#/components/schemas/CatalogId'
        annualSalesRangeId:
          $ref: '#/components/schemas/CatalogId'
        website:
          type: string
          maxLength: 2048
          format: uri
          description: 'Opcional: null representa ausencia. Tras recortar extremos, vacío se convierte a null; si tiene valor debe ser URL absoluta con esquema http o https y host válido, de máximo 2048 caracteres. No se agrega protocolo automáticamente ni se consulta DNS o la URL para validar. La propiedad debe enviarse incluso si no tiene valor.'
          nullable: true
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneRequest'
          description: 'Solo persona moral: colección no nula con al menos un teléfono válido. Para persona física debe enviarse null. El botón Eliminar retira filas localmente; Siguiente envía y guarda la colección completa restante. No existe borrado individual por teléfono; un fallo conserva la colección persistida.'
          nullable: true
      x-domain-rules:
      - Todas las propiedades deben enviarse; los opcionales sin valor y los campos no aplicables se envían como null.
      - Para persona física, sectorId, subsectorId y phones se envían explícitamente como null.
      - 'NATIONAL: país México y nacionalidad Mexicana, ambos de solo lectura.'
      - 'FOREIGN: país seleccionado, nacionalidad alfanumérica hasta 250 y código fiscal obligatorio hasta
        20.'
      - 'LEGAL_ENTITY: sector, subsector y al menos un teléfono obligatorios; subsector depende de sector.'
      - 'Titularidad: NATIONAL exige countryCode del país y taxRegime del solicitante; FOREIGN admite countryCode del país o key igual a NOT_DEF, sin filtro por régimen. NOT_DEF se admite incluso si existen opciones del país. Orden ascendente por key. Si el resultado extranjero está vacío, consultar NOT_DEF; sin registros, mantener lista vacía sin crear opciones. El backend aplica las mismas condiciones al guardar.'
      - Giro, estratificación, actividad preponderante, trabajadores y ventas obligatorios.
      - Se validan registros de catálogo vigentes cuando aplique.
      - Se exige cédula ya asociada al expediente mediante la operación de carga. Siguiente valida su presencia sin recibir UUID editable para confirmar o cambiar asociaciones. Carga y eliminación tienen efecto independiente del guardado de la sección.
      - Los campos de selección dependientes dentro de Datos Generales deben seleccionarse nuevamente si cambia su dependencia.
      - Los cambios en Datos Generales conservan intactos los tipos de participación, partidas seleccionadas y estado de progreso de CUCoP; no lo marcan para revisión.
      - Un campo opcional puede ser null y queda sin valor; no significa conservar el dato anterior. Si el
        campo es obligatorio por régimen u origen, null se rechaza.
      - Estratificación exige exactamente una opción del catálogo; no tiene asociación ni filtro por régimen.
      required:
      - origin
      - countryId
      - nationality
      - foreignFiscalCode
      - legalOwnershipId
      - sectorId
      - subsectorId
      - businessActivityId
      - stratificationId
      - primaryActivityId
      - workerCountRangeId
      - annualSalesRangeId
      - website
      - phones
      additionalProperties: false
      description: Guardado completo con Siguiente; no es PATCH. RFC, razón social, régimen, usuario, estado
        y progreso no son editables. La cédula se obtiene de su asociación persistida, no se adjunta aquí.
