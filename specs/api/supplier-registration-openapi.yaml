      bearerFormat: JWT
      description: 'JWT firmado por Authorization Bearer conforme a ADR-0015. Verificar firma RS256, claims y contexto del jti en cada operación protegida; vence a los 60 minutos. Un RFC puede tener varias sesiones vigentes. Evidencia y aceptación se resuelven desde el contexto backend.'

x-section-progress-rules:
- Una sección guardada permanece COMPLETED al editarla y tras un nuevo guardado válido.
- Un fallo conserva los datos y el progreso previamente persistidos.
- Eliminar lógicamente desasocia, marca metadatos y devuelve Datos Generales a PENDING en una transacción sin tocar el archivo físico ni modificar CUCoP o los demás datos. Fallar conserva referencia, marca y progreso. Cargar otra cédula no completa la sección hasta validar y guardar con Siguiente.
- Una nueva carga exige validar y guardar Datos Generales para volver a COMPLETED.
x-request-validation: Todos los requests y sus objetos anidados rechazan propiedades no definidas con VALIDATION_ERROR.

x-request-field-presence: Todas las propiedades definidas de los requests deben enviarse, también en objetos anidados. Los campos opcionales sin valor y los no aplicables se envían como null; omitir una propiedad produce VALIDATION_ERROR.

x-editable-text-normalization: >-
  Recortar espacios en blanco del inicio y final antes de validar obligatoriedad, longitud y formato.
  Conservar espacios interiores. Obligatorio vacío produce VALIDATION_ERROR; opcional vacío se convierte
  a null. Aplica también a número y extensión telefónicos. No normalizar ResultadoFirma, RFC, valores
  extraídos del certificado, identificadores, códigos de catálogo, tokens ni nombres originales de archivo.
  Las restricciones de longitud y formato de los textos editables se aplican al valor normalizado.

x-notice-acceptance-policy: >-
  Aviso fijo versión 1.0. Cada nueva identificación requiere aceptación expresa previa.
  El expediente conserva solo la última aceptación confirmada con fecha/hora del backend,
  sin historial de aceptaciones. Reanudar sustituye la anterior en la misma transacción que
  actualiza el nombre y vincula la evidencia de firma; un fallo conserva la aceptación anterior.
  Las evidencias de firma históricas no se eliminan ni sobrescriben por esta sustitución.

x-file-removal-policy: >-
  La carga guarda y asocia inmediatamente. Eliminar requiere confirmación y ejecuta solo una
  transacción de BD: retira la referencia de negocio, marca associated=false en metadatos y
  actualiza el progreso aplicable. No borra ni mueve contenido físico. Solo informa éxito tras
  commit; un fallo revierte esos cambios. Los metadatos y la ubicación permanecen para el
  proceso diario, que borra físicamente los no asociados con más de 24 horas desde la carga.
  Desasociar no reinicia la fecha de carga. El documento desasociado no se muestra ni descarga
  desde el expediente. Atrás no revierte operaciones documentales exitosas.

x-jwt-session-persistence: >-
  RegistrationContextPort usa JPA en la misma BD del registro, con un contexto por token emitido:
  jti, rfc, issued_at, expires_at y referencias de evidencia y aceptacion. Un RFC puede tener varios
  contextos vigentes. Token devuelto solo tras commit y consulta en cada peticion protegida. Un contexto
  ausente o vencido produce REGISTRATION_TOKEN_INVALID, aunque el JWT no haya vencido. Ver ADR-0015.
